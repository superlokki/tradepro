plugins { id 'java' }

group = 'com.tradepro'
version = '1.0.1'

// Nom des jars publiés : <username>_<addonName>_<addonVersion>.jar (username = compte Bookmap).
// Les serveurs Bookmap reconnaissent le fichier exact envoyé : ne pas recompiler une version déjà envoyée,
// augmenter le numéro de version.
def addonUser = findProperty('addonUser') ?: 'BrunoF'
def addonName = 'TradePro'

// API de l'installation Bookmap locale : la version correspond toujours, et aucun téléchargement n'est nécessaire.
// Autre emplacement : .\gradlew.bat jar -PbookmapLib="D:/Bookmap/lib"
def bookmapLib = findProperty('bookmapLib') ?: 'C:/Program Files/Bookmap/lib'

// Java 17, comme les exemples officiels : Bookmap repère l'add-on en scannant le bytecode, et son scanner (ASM)
// ne lit pas les versions trop récentes ("No entry points found in jar").
java {
    // Déclaré aussi ici pour les éditeurs : sans ça, Gradle annonce le niveau du JDK installé (27),
    // que l'extension Java de VS Code ne connaît pas encore.
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 17
}

dependencies {
    // Fournies par Bookmap au runtime -> compileOnly : l'add-on n'a aucune dépendance téléchargée
    compileOnly files("$bookmapLib/bm-l1api.jar", "$bookmapLib/bm-simplified-api-wrapper.jar")
}

// Mêmes emplacements que build.ps1 : classes dans build/classes, jar à la racine du projet.
def classesDir = layout.buildDirectory.dir('classes')
sourceSets.main.java.destinationDirectory = classesDir
// Même sans tests, Gradle garde un dossier de sortie « test », par défaut build/classes/java/test : imbriqué dans
// build/classes, il fait échouer l'import du projet dans VS Code ("Cannot nest output folder"). On le sort de là.
sourceSets.test.java.destinationDirectory = layout.buildDirectory.dir('test-classes')

// Rechargement rapide : charger ce fichier vide dans Bookmap lui fait lire les classes directement dans build/classes.
def marker = 'bm-strategy-package-fs-root.jar'
compileJava.doLast { classesDir.get().file(marker).asFile.createNewFile() }

jar {
    archiveFileName = "${addonUser}_${addonName}_${version}.jar"
    destinationDirectory = projectDir
    exclude marker
}
